name: Crash report
description: The Rubylight host or service stopped unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What you were doing
      description: What was happening when it crashed, and whether it happens again.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Rubylight version
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver
    validations:
      required: true

  - type: textarea
    id: bundle
    attributes:
      label: Support bundle
      description: |
        After a crash the console shows it under **Maintenance**. Choose **Download support
        bundle** and attach `butterpollo-support.zip`; it includes the crash dump and logs.
    validations:
      required: true
