name: Bug report
description: Something in Butterpollo does not work as described.
labels: [bug]
body:
  - type: textarea
    id: symptoms
    attributes:
      label: What happens
      description: What you did and what went wrong. Include any error code Moonlight showed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Butterpollo version
      description: Shown in the console under Maintenance, for example 2.0.0-rc.23.
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Installer (butterpollo-setup)
        - Portable package
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example Windows 11 24H2. Run `winver` to check.
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: For example RX 7900 XT, Adrenalin 26.9.1.
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client
      description: Device, Moonlight build and version, for example Moonlight PC 6.2.0 on a laptop.
    validations:
      required: true

  - type: input
    id: stream
    attributes:
      label: Stream settings
      description: Codec, resolution, frame rate, HDR and whether the client is wired or on Wi-Fi.
      placeholder: AV1, 1920x1080, 120 fps, HDR, Wi-Fi
    validations:
      required: false

  - type: textarea
    id: bundle
    attributes:
      label: Support bundle
      description: |
        In the console open **Logs** and choose **Download support bundle**, then attach
        `butterpollo-support.zip` here. It contains the host logs and diagnostics.
    validations:
      required: false
