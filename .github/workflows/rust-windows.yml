name: Rubylight Windows
permissions: {}
on:
  push:
    branches: [main]
    # A release tag publishes the GitHub release (tag and publish below).
    # GitHub ignores paths for tag pushes, so a tag always runs.
    tags: ['2.*']
    # Changes to docs and Markdown alone don't run CI; a release of such a
    # commit builds it in the windows job.
    paths: ['rust/**', '!rust/**/*.md', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'clippy.toml', 'third-party/**', '.github/workflows/rust-windows.yml']
  pull_request:
    paths: ['rust/**', '!rust/**/*.md', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'clippy.toml', 'third-party/**', '.github/workflows/rust-windows.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Release the version in Cargo.toml (main only); tags it like a pushed tag would
        type: boolean
        default: false
      notes:
        description: Only rewrite the published release's text from rust/RELEASE_NOTES.md on main; no build
        type: boolean
        default: false
concurrency:
  # A release run is never cancelled by a later push to main.
  group: butterpollo-rust-${{ github.ref }}-${{ inputs.publish && 'publish' || inputs.notes && 'notes' || 'ci' }}
  cancel-in-progress: true
jobs:
  # A tag must match Cargo.toml and have its release notes. When main's run
  # already built and tested the commit, the release reuses that build.
  tag:
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.built.outputs.run }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            if [ -n "$(git ls-remote --tags origin "refs/tags/$version")" ]; then
              echo "::error::$version is already tagged; bump the version first"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 rust/release/notes.py "$version" --out "$RUNNER_TEMP/body.md"
      - id: built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow rust-windows.yml --branch main --commit "$GITHUB_SHA" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then echo "::notice::reusing the build of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"; fi
  windows:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' && !needs.tag.outputs.run && !inputs.notes }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libvpl
      - name: Rust toolchains
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain 1.98.1-x86_64-pc-windows-gnu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The web console build needs Vite 7's Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check the web console
        working-directory: rust/web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/AppData/Local/ButterpolloRust/sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-sdk-v3-ffmpeg-2026.516.30821-pyro-502a3b52-patched-ngx-1.1.0
      - name: Test, lint and package Rust
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          .\rust\build.ps1 -MsysRoot '${{ steps.msys.outputs.msys2-location }}' -FetchDependencies -Package -TargetDirectory "$env:RUNNER_TEMP\butterpollo-rust-target"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: butterpollo-rust-windows-x64
          # The portable package and the setup that carries it.
          path: |
            ${{ runner.temp }}/butterpollo-rust-target/butterpollo-rust-release.zip
            ${{ runner.temp }}/butterpollo-rust-target/butterpollo-setup-*.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [tag, windows]
    if: ${{ !cancelled() && needs.tag.result == 'success' && (needs.tag.outputs.run || needs.windows.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
      BUILD: ${{ needs.tag.outputs.run || github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Publish the release
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::notice::$VERSION is already published"
            exit 0
          fi
          python3 rust/release/notes.py "$VERSION" --out body.md --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BUILD"
          gh run download "$BUILD" -n butterpollo-rust-windows-x64 -D build
          mkdir out
          mv "build/butterpollo-setup-$VERSION.exe" "out/rubylight-setup-$VERSION.exe"
          # Hosts from before the rename to Rubylight (rc.29 and older) only
          # update to an installer with the old name.
          cp "out/rubylight-setup-$VERSION.exe" "out/butterpollo-setup-$VERSION.exe"
          mv build/butterpollo-rust-release.zip "out/rubylight-$VERSION-windows-x64.zip"
          (cd out && sha256sum * > SHA256SUMS)
          flags=()
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Rubylight $VERSION" --notes-file body.md "${flags[@]}" out/*
          echo "::notice::published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION"
  # Corrects a published release's text after the fact, keeping its assets
  # and its link to the run that built it.
  notes:
    if: inputs.notes && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Rewrite the release text
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          run=$(gh release view "$version" --json body --jq .body | grep -o 'https://github.com/[^)]*/actions/runs/[0-9]*' | head -n 1 || true)
          python3 rust/release/notes.py "$version" --out body.md --run "$run"
          gh release edit "$version" --notes-file body.md
          echo "::notice::rewrote the text of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$version"
