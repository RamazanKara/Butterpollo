---
name: CI-Windows
permissions: {}

on:
  workflow_call:
    inputs:
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_tag:
        required: false
        type: string
        default: ''
      build_tests:
        required: false
        type: boolean
        default: false
      release_artifact_retention_days:
        required: false
        type: number
        default: 1
      symbol_product_name:
        required: true
        type: string
      symbol_release_prefix:
        required: true
        type: string
      publish_symbols:
        required: false
        type: boolean
        default: false
      symbol_release_repo:
        required: false
        type: string
        default: Nonary/vibeshine_symbols
      symbol_release_tag:
        required: false
        type: string
        default: ''
      symbol_release_draft:
        required: false
        type: boolean
        default: false
      upload_symbols_artifact:
        required: false
        type: boolean
        default: false
      require_truehdr_runtime:
        required: false
        type: boolean
        default: false
      truehdr_runtime_release_repo:
        required: false
        type: string
        default: Nonary/vibeshine_truehdr_runtime
      truehdr_runtime_release_tag:
        required: false
        type: string
        default: v1.0.0
      truehdr_runtime_asset_name:
        required: false
        type: string
        default: ''
    secrets:
      symbol_token:
        required: false
      truehdr_runtime_token:
        required: false

jobs:
  build_windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_VERSION: 22.22.2
      # Four vCPUs; mild oversubscription hides I/O while the largest
      # translation units still fit in memory.
      CMAKE_BUILD_PARALLEL_LEVEL: 6
      TRUEHDR_RUNTIME_ROOT: ${{ github.workspace }}\.vibeshine-deps\truehdr-runtime
      # PyroWave C API commit; its bitstream matches the PyroWave Moonlight clients.
      PYROWAVE_COMMIT: 89f7e47d4abbf650c91fae766728af866c5e32a0
      # Pinned VHF gamepad producer release. The CMake arguments in "Build
      # Windows" repeat these values literally.
      VHF_TAG: v0.1.0-beta.4
      VHF_ARCHIVE_SHA256: 7830a91ba281c44ae9d01e92e9086f72384a07ca1b35ee87150592f8f960361a
      VHF_SOURCE_REVISION: 0b3970e1a8c839f14f20a7c8eaf48ff59b8c1986
      VHF_DRIVER_VER: 09/13/2026,0.1.0.34
      VHF_PROTOCOL_VERSION: '2'
    defaults:
      run:
        shell: msys2 {0}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1
          submodules: recursive

      - name: Test VHF publisher trust policy
        if: inputs.build_tests
        shell: pwsh
        run: .\packaging\windows\virtual_gamepad_driver\tests\test_publisher_trust.ps1

      - name: Test VHF manifest channel contract
        if: inputs.build_tests
        shell: pwsh
        run: .\packaging\windows\virtual_gamepad_driver\tests\test_manifest_channel_contract.ps1

      - name: Test VHF CMake release contract
        if: inputs.build_tests
        shell: pwsh
        run: cmake -P .\packaging\windows\virtual_gamepad_driver\tests\test_release_contract.cmake

      - name: Test WiX sortable ProductCode contract
        if: inputs.build_tests
        shell: pwsh
        run: cmake -P .\packaging\windows\wix\tests\test_sortable_product_guid_contract.cmake

      - name: Download pinned VHF producer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gitlink = (git rev-parse "$($env:RELEASE_COMMIT):third-party/libvirtualgamepad").Trim()
          if ($LASTEXITCODE -ne 0 -or $gitlink -cne $env:VHF_SOURCE_REVISION) {
            throw "Release commit does not pin libvirtualgamepad $($env:VHF_SOURCE_REVISION); got '$gitlink'."
          }

          $packageRoot = Join-Path $env:RUNNER_TEMP 'vhf-gamepad-producer-release'
          .\scripts\download_libvirtualgamepad_release.ps1 `
            -Repository Nonary/libvirtualgamepad `
            -Tag $env:VHF_TAG `
            -ExpectedArchiveSha256 $env:VHF_ARCHIVE_SHA256 `
            -ExpectedSourceRevision $env:VHF_SOURCE_REVISION `
            -ExpectedDriverVer $env:VHF_DRIVER_VER `
            -ExpectedProtocolVersion $env:VHF_PROTOCOL_VERSION `
            -OutDir $packageRoot `
            -GitHubToken $env:GH_TOKEN
          "VHF_PACKAGE_ROOT=$packageRoot" >> $env:GITHUB_ENV

      - name: Resolve Windows build version
        shell: pwsh
        env:
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $buildVersion = $env:INPUT_RELEASE_VERSION

          if ([string]::IsNullOrWhiteSpace($buildVersion)) {
            if ($env:GITHUB_REF_VALUE -like 'refs/tags/*' -and -not [string]::IsNullOrWhiteSpace($env:GITHUB_REF_NAME_VALUE)) {
              $buildVersion = $env:GITHUB_REF_NAME_VALUE
            }
          }

          if ([string]::IsNullOrWhiteSpace($buildVersion)) {
            $buildVersion = '0.0.0'
          }

          if ($buildVersion -match '^v(.+)$') {
            $buildVersion = $Matches[1]
          }

          "Resolved Windows build version: $buildVersion"
          "BUILD_VERSION=$buildVersion" >> $env:GITHUB_ENV

      - name: Setup Dependencies Windows
        id: setup-msys2
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda  # v2.30.0
        with:
          msystem: ucrt64
          update: true
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-tools
            mingw-w64-ucrt-x86_64-vulkan-headers

      - name: Cache PyroWave
        id: cache-pyrowave
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ runner.temp }}/pyrowave-install
          key: pyrowave-${{ runner.os }}-ucrt64-${{ env.PYROWAVE_COMMIT }}-${{ hashFiles('scripts/build_pyrowave.sh') }}

      - name: Build PyroWave
        if: steps.cache-pyrowave.outputs.cache-hit != 'true'
        env:
          PYROWAVE_ROOT: ${{ runner.temp }}/pyrowave-install
          PYROWAVE_WORKDIR_WIN: ${{ runner.temp }}/pyrowave-work
        run: |
          set -euo pipefail
          # Stripped build of the pinned PyroWave C API; the bitstream must match
          # what the PyroWave Moonlight clients decode.
          PYROWAVE_STRIP=1 PYROWAVE_WORKDIR="$(cygpath -u "${PYROWAVE_WORKDIR_WIN}")" \
            bash scripts/build_pyrowave.sh "${PYROWAVE_COMMIT}" "$(cygpath -u "${PYROWAVE_ROOT}")"

      - name: Setup dotnet  # needed for wix
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309  # v5.1.0
        with:
          dotnet-version: '10.x'

      - name: Setup NodeJS
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src_assets/common/assets/web/package-lock.json
            src_assets/common/assets/web-legacy/package-lock.json

      - name: NodeJS Path
        shell: pwsh
        run: |
          $nodeBinaryPath = (Get-Command node).Source
          $nodePath = Split-Path -Path $nodeBinaryPath -Parent
          "NODEJS_PATH=$nodePath" >> $env:GITHUB_ENV
          "nodejs-path=$nodePath"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y

      - name: Download virtual display driver package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LIBVIRTUALDISPLAY_RELEASE_TAG: v1.6.3
        run: |
          $ErrorActionPreference = 'Stop'
          # The folder name carries the release version. refresh_driver_package.ps1
          # reads it from a libvirtualdisplay-<version>-windows-x64 path and then
          # never needs `git describe` in the (shallow, tagless) submodule checkout.
          $releaseVersion = $env:LIBVIRTUALDISPLAY_RELEASE_TAG.TrimStart('v')
          $downloadDir = Join-Path $PWD "libvirtualdisplay-$releaseVersion-windows-x64"
          .\scripts\download_libvirtualdisplay_release.ps1 `
            -Repository Nonary/libvirtualdisplay `
            -Tag $env:LIBVIRTUALDISPLAY_RELEASE_TAG `
            -OutDir $downloadDir `
            -GitHubToken $env:GH_TOKEN
          "VDD_PREBUILT_PACKAGE_DIR=$downloadDir" >> $env:GITHUB_ENV
          "Using virtual display driver package: $downloadDir"

      - name: Download pinned TrueHDR runtime
        if: inputs.require_truehdr_runtime
        shell: pwsh
        env:
          TRUEHDR_RUNTIME_TOKEN: ${{ secrets.truehdr_runtime_token || github.token }}
          TRUEHDR_RUNTIME_RELEASE_REPO: ${{ inputs.truehdr_runtime_release_repo }}
          TRUEHDR_RUNTIME_RELEASE_TAG: ${{ inputs.truehdr_runtime_release_tag }}
          TRUEHDR_RUNTIME_ASSET_NAME: ${{ inputs.truehdr_runtime_asset_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $args = @{
            Repository = $env:TRUEHDR_RUNTIME_RELEASE_REPO
            Tag = $env:TRUEHDR_RUNTIME_RELEASE_TAG
            OutDir = $env:TRUEHDR_RUNTIME_ROOT
            GitHubToken = $env:TRUEHDR_RUNTIME_TOKEN
          }
          if (-not [string]::IsNullOrWhiteSpace($env:TRUEHDR_RUNTIME_ASSET_NAME)) {
            $args.AssetName = $env:TRUEHDR_RUNTIME_ASSET_NAME
          }

          .\scripts\download_truehdr_runtime_release.ps1 @args
          "SUNSHINE_TRUEHDR_RUNTIME_DIR=$env:TRUEHDR_RUNTIME_ROOT" >> $env:GITHUB_ENV

      - name: Build Windows
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ inputs.release_commit }}
          REQUIRE_TRUEHDR_RUNTIME: ${{ inputs.require_truehdr_runtime }}
          PYROWAVE_ROOT: ${{ runner.temp }}/pyrowave-install
        run: |
          echo "Using BUILD_VERSION=${BUILD_VERSION}"

          NODEJS_PATH=$(cygpath -u "$NODEJS_PATH")
          export PATH="${NODEJS_PATH}:$PATH"
          NPM_PATH="$(cygpath -m "${NODEJS_PATH}/npm.cmd")"
          echo "Using node: $(command -v node) ($(node --version))"
          echo "Using npm: ${NPM_PATH} ($(npm --version))"

          vdd_prebuilt_arg=()
          if [[ -n "${VDD_PREBUILT_PACKAGE_DIR:-}" ]]; then
            vdd_prebuilt_arg=(-DSUNSHINE_LIBVIRTUALDISPLAY_PREBUILT_DIR="$(cygpath -u "${VDD_PREBUILT_PACKAGE_DIR}")")
            echo "Using prebuilt virtual display driver package: ${VDD_PREBUILT_PACKAGE_DIR}"
          fi
          if [[ -z "${VHF_PACKAGE_ROOT:-}" ]]; then
            echo "Verified VHF producer package path is missing." >&2
            exit 1
          fi
          vhf_gamepad_package_arg=(
            -DSUNSHINE_BUNDLE_VHF_GAMEPAD_DRIVER=ON
            -DSUNSHINE_LIBVIRTUALGAMEPAD_PREBUILT_DIR="$(cygpath -u "${VHF_PACKAGE_ROOT}")"
            -DSUNSHINE_VHF_GAMEPAD_RELEASE_TAG=v0.1.0-beta.4
            -DSUNSHINE_VHF_GAMEPAD_RELEASE_ASSET_SHA256=7830a91ba281c44ae9d01e92e9086f72384a07ca1b35ee87150592f8f960361a
            -DSUNSHINE_VHF_GAMEPAD_SOURCE_REVISION=0b3970e1a8c839f14f20a7c8eaf48ff59b8c1986
            -DSUNSHINE_VHF_GAMEPAD_DRIVER_VER=09/13/2026,0.1.0.34
            -DSUNSHINE_VHF_GAMEPAD_PROTOCOL_VERSION=2
          )
          truehdr_runtime_arg=()
          if [[ "${REQUIRE_TRUEHDR_RUNTIME}" == "true" ]]; then
            truehdr_runtime_arg=(
              -DSUNSHINE_TRUEHDR_RUNTIME_DIR="$(cygpath -u "${SUNSHINE_TRUEHDR_RUNTIME_DIR}")"
              -DSUNSHINE_REQUIRE_TRUEHDR_RUNTIME=ON
            )
            echo "Using pinned TrueHDR runtime: ${SUNSHINE_TRUEHDR_RUNTIME_DIR}"
          fi

          mkdir -p build
          # Test targets are opt-in for CI builds.
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_WERROR=ON \
            -DBUILD_TESTS=${{ inputs.build_tests && 'ON' || 'OFF' }} \
            -DBUILD_SUNSHINE_VIRTUAL_DISPLAY_DRIVER=OFF \
            -DBUILD_VIRTUALDISPLAY_PROBE=OFF \
            -DBUILD_VIRTUALDISPLAY_TOOLS=OFF \
            -DBUILD_VIRTUALDISPLAY_VULKAN_LAYER=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g -gdwarf-4" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g -gdwarf-4" \
            -DSUNSHINE_NPM_EXECUTABLE="${NPM_PATH}" \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="${GITHUB_REPOSITORY_OWNER}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/RamazanKara/Butterpollo" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/RamazanKara/Butterpollo/issues" \
            -DSUNSHINE_ENABLE_PYROWAVE=ON \
            -DSUNSHINE_PYROWAVE_ROOT="$(cygpath -u "${PYROWAVE_ROOT}")" \
            "${vdd_prebuilt_arg[@]}" \
            "${vhf_gamepad_package_arg[@]}" \
            "${truehdr_runtime_arg[@]}"
          echo "::add-matcher::.github/matchers/gcc.json"
          cmake --build build --target all --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          echo "::remove-matcher owner=gcc::"

      - name: Test native AMF lifecycle behavior
        run: |
          set -euo pipefail
          c++ \
            -std=gnu++23 \
            -O2 \
            -pthread \
            -DSUNSHINE_AMF_LIFECYCLE_STANDALONE \
            -I. \
            tests/unit/platform/windows/test_native_amf_review.cpp \
            -o build/native-amf-lifecycle-test.exe
          ./build/native-amf-lifecycle-test.exe

      - name: Install cv2pdb
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols || inputs.upload_symbols_artifact
        shell: pwsh
        env:
          CV2PDB_VERSION: "0.54"
        run: |
          $ErrorActionPreference = 'Stop'
          $cv2pdbDir = Join-Path $env:RUNNER_TEMP 'cv2pdb'
          $cv2pdbZip = Join-Path $env:RUNNER_TEMP 'cv2pdb.zip'
          $cv2pdbUrl = "https://github.com/rainers/cv2pdb/releases/download/v${env:CV2PDB_VERSION}/cv2pdb-${env:CV2PDB_VERSION}.zip"

          Invoke-WebRequest -Uri $cv2pdbUrl -OutFile $cv2pdbZip
          Expand-Archive -Path $cv2pdbZip -DestinationPath $cv2pdbDir -Force
          $cv2pdbExe = Get-ChildItem -Path $cv2pdbDir -Recurse -Filter cv2pdb64.exe -File | Select-Object -First 1
          if (-not $cv2pdbExe) {
            throw 'cv2pdb64.exe was not found in the downloaded archive.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $cv2pdbExe.FullName -Parent)

      - name: Generate Windows PDB
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols || inputs.upload_symbols_artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $executables = @(
            '.\build\sunshine.exe',
            '.\build\tools\audio-info.exe',
            '.\build\tools\dxgi-info.exe',
            '.\build\tools\sunshine_display_helper.exe',
            '.\build\tools\sunshine_wgc_capture.exe',
            '.\build\tools\sunshinesvc.exe'
          )

          foreach ($exe in $executables) {
            if (Test-Path -LiteralPath $exe) {
              & cv2pdb64.exe $exe
              if ($LASTEXITCODE -ne 0) {
                throw "PDB conversion failed for $exe (exit code $LASTEXITCODE)."
              }
              $pdb = [System.IO.Path]::ChangeExtension($exe, '.pdb')
              if (-not (Test-Path -LiteralPath $pdb)) {
                throw "PDB conversion produced no symbols for $exe."
              }
            }
          }

          $sunshineSvc = '.\build\tools\sunshinesvc.exe'
          $sunshineSvcPayload = '.\build\wix_payload\tools\sunshinesvc.exe'
          if ((Test-Path -LiteralPath $sunshineSvc) -and (Test-Path -LiteralPath $sunshineSvcPayload)) {
            Copy-Item -LiteralPath $sunshineSvc -Destination $sunshineSvcPayload -Force
          }

      - name: Package Windows Symbols
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols || inputs.upload_symbols_artifact
        id: package-windows-symbols
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SYMBOL_PRODUCT_NAME: ${{ inputs.symbol_product_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseVersion = $env:RELEASE_VERSION
          if ($releaseVersion -match '^v(.+)$') {
            $releaseVersion = $Matches[1]
          }

          $symbolsRoot = Join-Path $PWD 'symbols'
          $artifactName = "$($env:SYMBOL_PRODUCT_NAME)Symbols-$releaseVersion-windows-x64.7z"
          $artifactPath = Join-Path $symbolsRoot $artifactName
          "symbol_pack_name=$artifactName" >> $env:GITHUB_OUTPUT

          New-Item -ItemType Directory -Force -Path $symbolsRoot | Out-Null

          $pdbFiles = Get-ChildItem -Path build -Recurse -Filter *.pdb -File |
            Where-Object { $_.FullName -notlike '*\cpack_artifacts\*' }

          if (-not $pdbFiles) {
            throw 'No PDB files were produced.'
          }

          $buildRoot = (Resolve-Path build).Path
          $pdbPaths = @($pdbFiles | ForEach-Object { [System.IO.Path]::GetRelativePath($buildRoot, $_.FullName) })
          Push-Location $buildRoot
          try {
            & 7z a $artifactPath $pdbPaths
          } finally {
            Pop-Location
          }

      - name: Strip Windows binaries
        run: |
          set -euo pipefail

          mapfile -d '' binaries < <(
            find build -type f \( -name '*.exe' -o -name '*.dll' \) \
              ! -path '*/cpack_artifacts/*' \
              ! -path '*/CMakeFiles/*' \
              ! -path '*/_deps/*' \
              ! -path '*/tests/*' \
              -print0
          )

          if (( ${#binaries[@]} == 0 )); then
            echo "No Windows binaries found to strip."
            exit 0
          fi

          strip --strip-debug --strip-unneeded "${binaries[@]}"

          for binary in "${binaries[@]}"; do
            if objdump -h "${binary}" | grep -Eq ' \.(debug|zdebug)'; then
              echo "Unstripped debug sections remain in ${binary}" >&2
              exit 1
            fi
          done

      - name: Package Windows MSI
        id: package-windows-msi
        run: |
          set -euo pipefail
          mkdir -p unsigned-msi
          cmake --build build --target package_msi --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"

          msi_path=$(ls -t build/cpack_artifacts/*.msi 2>/dev/null | head -n 1 || true)
          if [[ -z "${msi_path}" ]]; then
            echo "Expected MSI was not produced." >&2
            find build/cpack_artifacts -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi

          msi_name="$(basename "${msi_path}")"
          cp "${msi_path}" "unsigned-msi/${msi_name}"
          echo "msi_name=${msi_name}" >> "${GITHUB_OUTPUT}"

      - name: Verify unsigned MSI contains the pinned VHF package
        shell: pwsh
        env:
          MSI_NAME: ${{ steps.package-windows-msi.outputs.msi_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'unsigned-vhf-msi-extract'
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          $msiPath = Join-Path $PWD "unsigned-msi\$($env:MSI_NAME)"
          $process = Start-Process msiexec.exe -ArgumentList @('/a', $msiPath, '/qn', "TARGETDIR=$extractRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Administrative extraction of unsigned MSI failed with exit code $($process.ExitCode)."
          }
          $packageDir = Join-Path $extractRoot 'Apollo\drivers\vhf-gamepad'
          .\packaging\windows\virtual_gamepad_driver\refresh_driver_package.ps1 `
            -ValidateOnly `
            -PrebuiltPackageDir $env:VHF_PACKAGE_ROOT `
            -PackageDir $packageDir `
            -ReleaseTag $env:VHF_TAG `
            -ExpectedReleaseAssetSha256 $env:VHF_ARCHIVE_SHA256 `
            -ExpectedSourceRevision $env:VHF_SOURCE_REVISION `
            -ExpectedDriverVer $env:VHF_DRIVER_VER `
            -ExpectedProtocolVersion $env:VHF_PROTOCOL_VERSION
          $expected = @(
            'cleanup.ps1',
            'driver/VibeshineVhfGamepad.cat',
            'driver/VibeshineVhfGamepad.dll',
            'driver/VibeshineVhfGamepad.inf',
            'install.ps1',
            'manifest.json',
            'release-lock.json',
            'tools/VibeshineVhfGamepadDeviceSetup.exe'
          )
          $actual = @(Get-ChildItem -LiteralPath $packageDir -Recurse -File | ForEach-Object {
            $_.FullName.Substring($packageDir.Length).TrimStart('\', '/').Replace('\', '/')
          } | Sort-Object)
          if (($actual -join "`n") -cne ($expected -join "`n")) {
            throw "Unsigned MSI VHF layout is not exact: $($actual -join ', ')"
          }

      - name: Verify unsigned MSI ships the PyroWave runtime
        shell: pwsh
        env:
          MSI_NAME: ${{ steps.package-windows-msi.outputs.msi_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'unsigned-pyrowave-msi-extract'
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          $msiPath = Join-Path $PWD "unsigned-msi\$($env:MSI_NAME)"
          $process = Start-Process msiexec.exe -ArgumentList @('/a', $msiPath, '/qn', "TARGETDIR=$extractRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Administrative extraction of unsigned MSI failed with exit code $($process.ExitCode)."
          }
          # sunshine.exe imports libpyrowave-shared-0.dll, so the DLL must sit next
          # to it; the MIT notices of PyroWave, Granite and volk ship alongside.
          $appRoot = Join-Path $extractRoot 'Apollo'
          $required = @(
            'sunshine.exe',
            'libpyrowave-shared-0.dll',
            'licenses\pyrowave\LICENSE',
            'licenses\pyrowave\LICENSE.Granite',
            'licenses\pyrowave\LICENSE.volk.md'
          )
          foreach ($relative in $required) {
            $path = Join-Path $appRoot $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Unsigned MSI is missing the PyroWave payload: $relative"
            }
          }
          Write-Host 'The MSI ships the PyroWave runtime and its license texts.'

      - name: Upload unsigned MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-msi-package-Windows
          path: unsigned-msi/${{ steps.package-windows-msi.outputs.msi_name }}
          if-no-files-found: error
          retention-days: ${{ inputs.release_artifact_retention_days }}
          overwrite: true

      - name: Upload Windows symbols package
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols || inputs.upload_symbols_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-symbols-Windows
          path: symbols/${{ steps.package-windows-symbols.outputs.symbol_pack_name }}
          if-no-files-found: error
          retention-days: ${{ inputs.release_artifact_retention_days }}
          overwrite: true

      - name: Package Windows installer
        shell: pwsh
        env:
          MSI_NAME: ${{ steps.package-windows-msi.outputs.msi_name }}
          SYMBOL_PRODUCT_NAME: ${{ inputs.symbol_product_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $installerName = "$($env:SYMBOL_PRODUCT_NAME)Setup.exe"
          $msiPath = Join-Path $PWD "unsigned-msi\$($env:MSI_NAME)"
          & (Join-Path $PWD 'packaging/windows/bootstrapper/build_bootstrapper.ps1') `
            -BuildDir (Join-Path $PWD 'build') `
            -MsiPath $msiPath `
            -OutputName $installerName

          $installerExe = Join-Path $PWD "build\cpack_artifacts\$installerName"
          if (-not (Test-Path -LiteralPath $installerExe)) {
            throw "Expected setup executable was not produced: $installerExe"
          }
          $artifactRoot = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          Copy-Item -LiteralPath $installerExe -Destination $artifactRoot -Force

      - name: Include symbols in build artifact
        if: inputs.upload_symbols_artifact
        shell: pwsh
        env:
          SYMBOL_PACK_NAME: ${{ steps.package-windows-symbols.outputs.symbol_pack_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $symbolPack = Join-Path (Join-Path $PWD 'symbols') $env:SYMBOL_PACK_NAME
          if (-not (Test-Path -LiteralPath $symbolPack)) {
            throw "Private symbol pack not found: $symbolPack"
          }
          Copy-Item -LiteralPath $symbolPack -Destination (Join-Path $PWD 'artifacts') -Force

      - name: Record release artifact provenance
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $PWD 'artifacts'
          $assetHashes = [ordered]@{}
          Get-ChildItem -LiteralPath $artifactRoot -File | ForEach-Object {
            $assetHashes[$_.Name] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if ($assetHashes.Count -eq 0) {
            throw 'No finalized release artifacts were found for provenance.'
          }
          $provenance = [ordered]@{
            schema_version = 1
            release_tag = $env:RELEASE_TAG
            release_commit = $env:RELEASE_COMMIT
            source_build_run_id = $env:SOURCE_BUILD_RUN_ID
            assets = $assetHashes
          }
          $manifestPath = Join-Path $artifactRoot 'release-provenance.json'
          $provenance | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          Write-Host "Recorded release provenance for $($env:RELEASE_COMMIT) from CI run $($env:SOURCE_BUILD_RUN_ID)."

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-Windows
          path: artifacts/
          if-no-files-found: error
          overwrite: true

      - name: Publish private symbols release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.symbol_token }}
          RELEASE_TAG: ${{ inputs.release_tag || inputs.release_version }}
          SYMBOL_RELEASE_DRAFT: ${{ inputs.symbol_release_draft }}
          SYMBOL_RELEASE_PREFIX: ${{ inputs.symbol_release_prefix }}
          SYMBOL_RELEASE_TAG: ${{ inputs.symbol_release_tag }}
          SYMBOL_PRODUCT_NAME: ${{ inputs.symbol_product_name }}
          SYMBOLS_REPO: ${{ inputs.symbol_release_repo }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "SYMBOL_TOKEN is required to upload private symbols to $($env:SYMBOLS_REPO)."
          }

          $sourceReleaseTag = $env:RELEASE_TAG
          $releaseVersion = $sourceReleaseTag
          if ($releaseVersion -match '^v(.+)$') {
            $releaseVersion = $Matches[1]
          }

          if ([string]::IsNullOrWhiteSpace($env:SYMBOL_RELEASE_TAG)) {
            if ($releaseVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+((-(alpha|beta|rc|stable)([.-][0-9A-Za-z.-]+)?)|-stable)?$') {
              throw "Unsupported release tag '$sourceReleaseTag'. Expected a release tag like v1.15.2-beta.2."
            }

            if ($env:SYMBOL_RELEASE_PREFIX -notmatch '^(shine|polo)$') {
              throw "Unsupported symbol release prefix '$($env:SYMBOL_RELEASE_PREFIX)'. Expected 'shine' or 'polo'."
            }

            $symbolReleaseTag = "$($env:SYMBOL_RELEASE_PREFIX)_$releaseVersion"
            $prerelease = ($releaseVersion -match '-(alpha|beta|rc)([.-][0-9A-Za-z.-]+)?$')
          } else {
            $symbolReleaseTag = $env:SYMBOL_RELEASE_TAG
            $prerelease = $true
          }

          $draft = ($env:SYMBOL_RELEASE_DRAFT -eq 'true')
          $symbolPack = Join-Path (Join-Path $PWD 'symbols') "$($env:SYMBOL_PRODUCT_NAME)Symbols-$releaseVersion-windows-x64.7z"

          if (-not (Test-Path -LiteralPath $symbolPack)) {
            Get-ChildItem -Path symbols -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw "Private symbol pack not found: $symbolPack"
          }

          $releaseTitle = "$($env:SYMBOL_PRODUCT_NAME) symbols v$releaseVersion"
          $releaseNotes = "Private Windows debug symbols for $($env:SYMBOL_PRODUCT_NAME) v$releaseVersion (source release $sourceReleaseTag)."

          function ConvertTo-JqStringLiteral([string] $Value) {
            return $Value.Replace('\', '\\').Replace('"', '\"')
          }

          function Find-Release([string] $Repo, [string] $Tag, [string] $Name) {
            $jqTag = ConvertTo-JqStringLiteral $Tag
            $releaseJson = @(& gh api --paginate "repos/$Repo/releases" --jq ".[] | select(.tag_name == `"$jqTag`") | @json")
            if ($LASTEXITCODE -ne 0) { throw "Failed to list releases for '$Repo'." }

            if ($releaseJson.Count -eq 0) {
              $jqName = ConvertTo-JqStringLiteral $Name
              $releaseJson = @(& gh api --paginate "repos/$Repo/releases" --jq ".[] | select(.draft == true and .name == `"$jqName`") | @json")
              if ($LASTEXITCODE -ne 0) { throw "Failed to list draft releases for '$Repo'." }
            }

            if ($releaseJson.Count -eq 0) { return $null }
            return ($releaseJson[0] | ConvertFrom-Json)
          }

          $draftValue = $draft.ToString().ToLowerInvariant()
          $prereleaseValue = $prerelease.ToString().ToLowerInvariant()
          $release = Find-Release -Repo $env:SYMBOLS_REPO -Tag $symbolReleaseTag -Name $releaseTitle

          if ($null -ne $release) {
            $releaseJson = & gh api `
              --method PATCH `
              "repos/$($env:SYMBOLS_REPO)/releases/$($release.id)" `
              -f "tag_name=$symbolReleaseTag" `
              -f 'target_commitish=main' `
              -f "name=$releaseTitle" `
              -f "body=$releaseNotes" `
              -F "draft=$draftValue" `
              -F "prerelease=$prereleaseValue"
            if ($LASTEXITCODE -ne 0) { throw "Failed to update private symbols release '$symbolReleaseTag'." }
          } else {
            $releaseJson = & gh api `
              --method POST `
              "repos/$($env:SYMBOLS_REPO)/releases" `
              -f "tag_name=$symbolReleaseTag" `
              -f 'target_commitish=main' `
              -f "name=$releaseTitle" `
              -f "body=$releaseNotes" `
              -F "draft=$draftValue" `
              -F "prerelease=$prereleaseValue"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create private symbols release '$symbolReleaseTag'." }
          }

          $release = $releaseJson | ConvertFrom-Json
          $releaseId = $release.id
          if ([string]::IsNullOrWhiteSpace($releaseId)) { throw "Failed to resolve private symbols release id for '$symbolReleaseTag'." }

          $uploadUrl = [string] $release.upload_url
          if ([string]::IsNullOrWhiteSpace($uploadUrl)) { throw "Failed to resolve private symbols upload URL for '$symbolReleaseTag'." }
          $uploadUrl = $uploadUrl -replace '\{.*$', ''

          $assetName = Split-Path -Leaf $symbolPack
          $assetsJson = & gh api "repos/$($env:SYMBOLS_REPO)/releases/$releaseId/assets"
          if ($LASTEXITCODE -ne 0) { throw "Failed to list private symbols assets for '$symbolReleaseTag'." }

          $assetIds = @($assetsJson | ConvertFrom-Json | Where-Object { $_.name -eq $assetName } | Select-Object -ExpandProperty id)
          foreach ($assetId in $assetIds) {
            & gh api --method DELETE "repos/$($env:SYMBOLS_REPO)/releases/assets/$assetId" *> $null
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete existing private symbol asset '$assetName'." }
          }

          $encodedAssetName = [System.Uri]::EscapeDataString($assetName)
          & gh api `
            --method POST `
            "${uploadUrl}?name=${encodedAssetName}" `
            -H 'Content-Type: application/octet-stream' `
            --input $symbolPack `
            *> $null
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload private symbol pack '$symbolPack'." }

          Write-Host "Uploaded $assetName to $($env:SYMBOLS_REPO) release $symbolReleaseTag (id $releaseId)."

      - name: Debug wix
        if: always() && steps.package-windows-msi.outcome == 'failure'
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'build\cpack_artifacts\_CPack_Packages\win64\WIX\wix.log'
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
          } else {
            Write-Host "WiX log was not found: $log"
          }
