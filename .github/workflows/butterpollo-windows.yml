name: Butterpollo Windows build
permissions: {}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: butterpollo-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Unsigned Butterpollo installer
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      release_commit: ${{ github.sha }}
      release_version: 2.0.0-beta.3-butter.1
      build_only: false
      build_tests: true
      release_artifact_retention_days: 30
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      publish_symbols: false
      require_signpath_signing: false
      require_truehdr_runtime: true
