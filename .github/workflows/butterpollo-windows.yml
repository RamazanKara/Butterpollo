name: Butterpollo C++ reference build
permissions: {}

# The C++ host is kept as a reference since Butterpollo 2.0 (the Rust host,
# built by rust-windows.yml). Run it by hand; it no longer runs on pushes.
on:
  workflow_dispatch:

concurrency:
  group: butterpollo-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Unsigned Butterpollo installer
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      release_commit: ${{ github.sha }}
      release_version: 2.0.0-beta.3-butter.4
      build_tests: true
      release_artifact_retention_days: 30
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      publish_symbols: false
      require_truehdr_runtime: true
