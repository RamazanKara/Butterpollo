[workspace]
members = ["rust/core", "rust/windows", "rust/host", "rust/vulkan-layer", "rust/setup"]
exclude = ["rust/truehdr-runtime"]
resolver = "3"

[workspace.package]
version = "2.0.0-rc.27"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/RamazanKara/Butterpollo"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
