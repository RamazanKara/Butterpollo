[package]
name = "butterpollo-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
butterpollo-core = { path = "../core" }
libloading = "0.8"
half = "2.7"

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
windows = { version = "0.62.2", features = [
 "Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
 "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
 "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
 "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
 "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Controls", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Registry",
 "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_DataExchange",
 "Win32_System_Services", "Win32_System_RemoteDesktop", "Win32_System_Environment",
 "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security",
 "Win32_System_Diagnostics_Debug", "Win32_System_Kernel",
 "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Input_Touch",
 "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi",
 "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
 "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Display", "Win32_System_IO", "Win32_Networking_WinSock"
] }

[build-dependencies]
bindgen = "0.72"

[dev-dependencies]
tempfile = "3.23"
