[package]
name = "butterpollo-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Installs, upgrades and removes Butterpollo, replacing Vibepollo in place"

[[bin]]
name = "butterpollo-setup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
windows = { version = "0.62.2", features = [
 "Win32_Foundation", "Win32_Security", "Win32_System_Services", "Win32_System_Registry",
 "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Com",
 "Win32_System_ApplicationInstallationAndServicing", "Win32_UI_Shell", "Win32_UI_Controls",
 "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"
] }

[dev-dependencies]
tempfile = "3.23"

[build-dependencies]
embed-resource = "3.0.12"

[lints]
workspace = true
